# 爬取配置
# 把 API key 填到这里；或用环境变量 SS_API_KEY / GITHUB_TOKEN 覆盖
# 不填也能跑，但有更严格的速率限制

paths:
  names_csv: ./data/names_seed.csv
  output_dir: ./data/traces
  cache_dir: ./data/cache
  log_dir: ./data/logs

http:
  timeout_seconds: 30
  retry_max: 3
  retry_backoff_seconds: 5
  user_agent: "AI-Talent-Profile-Research/0.1 (academic; contact: your-email@example.com)"

rate_limit:
  semantic_scholar_seconds: 1.0   # 无 key: 5req/5min;  有 key: 1req/s 安全
  github_seconds: 1.0
  arxiv_seconds: 3.0              # arXiv 要求 ≥3s 间隔
  wikipedia_seconds: 0.5

api_keys:
  semantic_scholar: ""            # 申请：https://www.semanticscholar.org/product/api
  github: ""                      # https://github.com/settings/tokens (read:public)

sources:
  semantic_scholar: true
  arxiv: true
  github: true
  wikipedia: true
  personal_site: true             # 仅在 CSV 提供 URL 时抓取

scraping:
  max_papers_per_author: 50       # Semantic Scholar 取前 N 篇（按引用排序）
  max_arxiv_per_author: 30
  max_repos_per_user: 30
  github_readme_chars: 4000       # 每个 repo README 截断长度
  abstract_chars: 600
