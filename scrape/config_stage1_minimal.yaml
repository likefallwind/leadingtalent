# 阶段一补跑配置：跳过 arXiv 和 GitHub，避免公共 API 429 阻塞。

paths:
  names_csv: ./data/names_seed.csv
  output_dir: ./data/traces
  cache_dir: ./data/cache
  log_dir: ./data/logs

http:
  timeout_seconds: 30
  retry_max: 3
  retry_backoff_seconds: 5
  user_agent: "AI-Talent-Profile-Research/0.1 (academic; contact: your-email@example.com)"

rate_limit:
  semantic_scholar_seconds: 1.0
  github_seconds: 1.0
  arxiv_seconds: 3.0
  wikipedia_seconds: 0.5

api_keys:
  semantic_scholar: ""
  github: ""

sources:
  semantic_scholar: true
  arxiv: false
  github: false
  wikipedia: true
  personal_site: true

scraping:
  max_papers_per_author: 50
  max_arxiv_per_author: 30
  max_repos_per_user: 30
  github_readme_chars: 4000
  abstract_chars: 600
