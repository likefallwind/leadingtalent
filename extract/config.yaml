# Round 1 双抽取配置
# 设计：每人 × 每条件(open/seeded) × 每模型 × 每 run = 一份 JSON

paths:
  profiles_dir: ../scrape/data/traces      # scrape 模块输出
  prompts_dir: ./prompts
  output_dir: ./data/extractions
  log_dir: ./data/logs

# 模型组合：每条目跑一组采样
# provider: anthropic | openai_compat
# 想关掉某模型把 enabled 设为 false
models:
  - id: claude-sonnet
    provider: anthropic
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    base_url: ""
    enabled: true

  - id: gpt-4o
    provider: openai_compat
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    base_url: "https://api.openai.com/v1"
    enabled: true

  - id: deepseek-chat
    provider: openai_compat
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    base_url: "https://api.deepseek.com/v1"
    enabled: true

# 每个 (人 × 条件 × 模型) 跑几次。降到 1 表示不做内部稳定性校验
runs_per_combo: 2

conditions:
  open:
    prompt_file: open.md
    enabled: true
  seeded:
    prompt_file: seeded.md
    enabled: true

llm:
  temperature: 0.7              # 高一点拿到分布而非点估计；多 run 才有意义
  max_tokens: 3000
  timeout_seconds: 120
  retry_max: 3
  retry_backoff_seconds: 10

profile:
  # profile.md 长度上限（防止超 context）。超过会截断中间部分
  max_chars: 30000
