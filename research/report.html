const DATA = {"clusters": {"CL1": "长期专注·数十年持续产出", "CL2": "按长期信念逆向押注", "CL3": "造\"基础件\"（方法/架构/系统/标准/数据集）", "CL4": "跨学科·跨界迁移", "CL5": "工程贯通到量产/产品/平台", "CL6": "从零创建并长期领导机构", "CL7": "师父·批量育人成谱系", "CL8": "早慧硬底子+顶级师承", "CL9": "多角色转场·被持续争抢", "CL10": "撬动巨额资本与组织动员", "CL11": "选大问题·愿景组织攻坚", "CL12": "教育/科普/把复杂讲清楚", "CL13": "开源·开放作为路线", "CL14": "安全/风险/治理/伦理担当", "CL15": "命名/造词/框架化·元认知自省", "CL16": "韧性·挫折·诚实面对边界", "CL17": "捕捉拐点/窗口·趋势预判", "CL0": "其他/未归簇"}, "colors": {"CL1": "#7c83ff", "CL2": "#ff6b6b", "CL3": "#ffb020", "CL4": "#36c5f0", "CL5": "#2ec27e", "CL6": "#a06cd5", "CL7": "#f78fb3", "CL8": "#f9a826", "CL9": "#4dd0e1", "CL10": "#e15554", "CL11": "#9b5de5", "CL12": "#43aa8b", "CL13": "#577590", "CL14": "#d62246", "CL15": "#b5179e", "CL16": "#8d6e63", "CL17": "#1982c4", "CL0": "#9aa0a6"}, "people": [{"id": "F01", "name": "F01 Geoffrey Hinton", "intro": "多伦多大学荣休教授；深度学习奠基者之一。主要活跃窗口 1972–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1947.12.6 生于伦敦温布尔登；George Boole（布尔代数）与 George Everest 的玄外孙，父亲 H.E. Hinton 是昆虫学家——成长于科学世家。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "剑桥国王学院本科读实验心理学(1970)；19 岁伤了背、长期与抑郁相处。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "1978 在爱丁堡大学获 AI 博士，导师 Longuet-Higgins；当时神经网络方向极不被看好。(src: en.wiki)"}, {"id": "F4", "conf": "B", "t": "1980s 因不满里根时代政治与军方 AI 经费，从美国迁往加拿大；自述持社会主义立场。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "1985 与 Ackley、Sejnowski 共同发明玻尔兹曼机。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "1986.10 与 Rumelhart、Williams 在 Nature 发表反向传播论文，使其广为人知（非首创，他本人称\"基本思想是 Rumelhart 的\"）。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "1995 与 Dayan、Frey、Neal 提出 wake-sleep 算法(Science)。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "2008 与 van der Maaten 提出 t-SNE 降维可视化。(src: en.wiki)"}, {"id": "F9", "conf": "A", "t": "2012 与学生 Krizhevsky、Sutskever 做出 AlexNet，ImageNet 上断层夺冠，引爆深度学习浪潮。(src: en.wiki)"}, {"id": "F10", "conf": "A", "t": "此外推广 dropout、知识蒸馏；2017 胶囊网络、2022 Forward-Forward 算法(NeurIPS)——75 岁仍在出新方法。(src: en.wiki)"}, {"id": "F11", "conf": "A", "t": "累计 200+ 同行评审论文。(src: en.wiki)"}, {"id": "F12", "conf": "A", "t": "博士生/博后包括 Sutskever、Krizhevsky、Salakhutdinov、Yee Whye Teh、Brendan Frey、Radford Neal、Max Welling，甚至 LeCun 曾做其博后——批量孵化出后来的核心人物。(src: en.wiki)"}, {"id": "F13", "conf": "A", "t": "2012 与两名学生创办 DNNresearch；2013.3 被 Google 以 4400 万美元收购，加入 Google Brain。(src: en.wiki)"}, {"id": "F14", "conf": "A", "t": "2013–2023 同时供职 Google Brain 与多大；2017 联合创办并任 Vector Institute 首席科学顾问。(src: en.wiki)"}, {"id": "F15", "conf": "A", "t": "2023.5 公开辞别 Google，称要\"自由谈论 AI 风险而不必顾及对 Google 的影响\"，自述\"部分后悔毕生工作\"。(src: en.wiki)"}, {"id": "F16", "conf": "A", "t": "2001 首届 Rumelhart Prize；2018 图灵奖（与 Bengio、LeCun）；2024 诺贝尔物理学奖（与 Hopfield）；2025 英国女王工程奖、哈佛荣誉博士。(src: en.wiki)"}, {"id": "F17", "conf": "A", "t": "FRS(1998)、美国国家工程院(2016)、国家科学院(2023) 等。(src: en.wiki)"}, {"id": "F18", "conf": "A", "t": "转向前认为 AGI 还有 30–50 年；2023.3 改口\"可能不到 20 年\"，规模堪比工业革命/电力。(src: en.wiki)"}, {"id": "F19", "conf": "A", "t": "2024.12 公开估计 AI 在 30 年内致人类灭绝的概率为 10–20%。(src: en.wiki)"}, {"id": "F20", "conf": "A", "t": "2024.8 与 Bengio、Russell、Lessig 联署支持加州 SB 1047 AI 安全立法；2024 呼吁英国设全民基本收入应对 AI 失业。(src: en.wiki)"}, {"id": "F21", "conf": "B", "t": "Schmidhuber 长期指其对 Werbos、Amari 等反传早期工作的引用不足（署名权争议）。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "在一个被主流判死刑的方向上数十年坚持下注、不随寒冬摇摆", "from": "F3,F4,F6", "cl": "CL2"}, {"id": "C2", "t": "把另一学科的工具（统计物理）迁移进本领域造出新模型", "from": "F5", "cl": "CL4"}, {"id": "C3", "t": "反复造出被全行业当作\"标准件\"使用的基础方法（反传普及/dropout/蒸馏/t-SNE）", "from": "F6,F8,F10", "cl": "CL3"}, {"id": "C4", "t": "抓住硬件+数据拐点，用一次决定性实证（AlexNet）让长期理论被产业接受", "from": "F9", "cl": "CL17"}, {"id": "C5", "t": "七旬高龄仍持续提出全新方法、不吃老本（时间跨度上的罕见持续生产力）", "from": "F10", "cl": "CL1"}, {"id": "C6", "t": "作为\"师父\"批量孵化出下一代领军人物，形成学术谱系", "from": "F12", "cl": "CL7"}, {"id": "C7", "t": "把研究成果转化为可被高价收购的实体并嵌入巨头", "from": "F13", "cl": "CL5"}, {"id": "C8", "t": "在自己亲手推动的技术成功后公开转向警示风险、宁可\"后悔毕生工作\"也不为既得立场背书", "from": "F15,F18,F19", "cl": "CL14"}, {"id": "C9", "t": "把个人声誉转化为公共政策影响力（联署立法、倡导 UBI）", "from": "F20", "cl": "CL14"}, {"id": "C10", "t": "公开承认他人优先权、对自身署名保持坦诚", "from": "F6,F21", "cl": "CL15"}, {"id": "C11", "t": "个人长期与抑郁/伤病/三任配偶中两任病逝的逆境共存，仍维持顶级产出", "from": "F2", "cl": "CL16"}]}, {"id": "F02", "name": "F02 Yann LeCun", "intro": "纽约大学教授；卷积网络与自监督/世界模型推动者。主要活跃窗口 1987–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1960.7.8 生于法国 Soisy-sous-Montmorency；1983 ESIEE Paris 工程师文凭，1987 巴黎六大计算机博士（博士期间已提出早期反传形式）。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "1987–1988 在多伦多大学做 Hinton 的博士后——师承同一谱系。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "1989 LeNet：把反向传播用于手写邮编识别；1998《Gradient-based Learning Applied to Document Recognition》奠定 CNN。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "1990s 末 OCR 技术读取全美约 10% 支票——早期大规模商用落地。(src: 多源)"}, {"id": "F5", "conf": "A", "t": "1990 与人提出 Optimal Brain Damage 剪枝正则化方法。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "1998 与 Bottou、Haffner 发明 DjVu 图像压缩技术。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2000s–2010s 推动能量模型(energy-based models)；2013+ 主张自监督学习与 JEPA（联合嵌入预测架构）。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "1988–1996 AT&T 贝尔实验室；1996–2003 AT&T Labs 图像处理研究部主管；2003 起 NYU 教授，2012 创办 NYU 数据科学中心。(src: en.wiki)"}, {"id": "F9", "conf": "A", "t": "2013 加入 Facebook/Meta 任首席 AI 科学家、创建 FAIR；同年与 Bengio 共同创办 ICLR 会议并推行\"发表后开放评审\"。(src: en.wiki)"}, {"id": "F10", "conf": "A", "t": "2025.11.19 宣布离开 Meta；2025.12 共同创办 AMI Labs(Advanced Machine Intelligence) 任执行主席；2026.3 融资 10.3 亿美元、投前估值 35 亿。(src: en.wiki/Fortune)"}, {"id": "F11", "conf": "A", "t": "2018 图灵奖（与 Hinton、Bengio）；2021 美国科学院院士；2025 英国女王工程奖。(src: en.wiki)"}, {"id": "F12", "conf": "A", "t": "2025.11 公开称\"LLM 在通往超级智能上基本是死胡同\"，并坦言 Meta 内不少人不希望他这么说。(src: en.wiki)"}, {"id": "F13", "conf": "A", "t": "长期主张世界模型/能量模型优于 transformer-LLM 路线，并以此组织研究议程。(src: en.wiki)"}, {"id": "F14", "conf": "A", "t": "长期公开主张开放科学/开源，反对 AI\"末日论\"叙事——与同辈 Hinton/Bengio 形成鲜明对照。(src: 多源)"}], "caps": [{"id": "C1", "t": "把一个算法思想一路打通到工业级量产系统（LeNet→全美 10% 支票）", "from": "F3,F4", "cl": "CL5"}, {"id": "C2", "t": "在大公司内部从零搭建并长期领导世界级研究院", "from": "F9", "cl": "CL6"}, {"id": "C3", "t": "坚持开放/开源路线，连学术评审制度都要改造（创办 ICLR + 开放评审）", "from": "F9,F14", "cl": "CL13"}, {"id": "C4", "t": "在全行业一致看多某条路线（LLM/末日论）时同时反对两边、押注第三条（世界模型）", "from": "F12,F13,F14", "cl": "CL2"}, {"id": "C5", "t": "学术教席与产业领导身份数十年并行", "from": "F8,F9", "cl": "CL9"}, {"id": "C6", "t": "功成名就（图灵奖+院士）后 65 岁仍离开高薪平台为信念另起炉灶", "from": "F10,F12", "cl": "CL2"}, {"id": "C7", "t": "以\"长期技术信念\"而非热点组织研究，敢于公开承担与雇主相左的代价", "from": "F12,F13", "cl": "CL2"}, {"id": "C8", "t": "反复发明被沿用的工程技术（CNN、DjVu、剪枝）", "from": "F3,F5,F6", "cl": "CL3"}]}, {"id": "F03", "name": "F03 Yoshua Bengio", "intro": "蒙特利尔大学教授、Mila 创始人、LawZero 创始人。主要活跃窗口 1991–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1964.3.5 生于巴黎；父亲是药剂师/剧作家、母亲是演员/经济学家；弟弟 Samy Bengio 是 Apple AI/ML 研究高级总监——家族双 AI。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "麦吉尔大学本硕博；1991 博士论文做神经网络与序列识别；后在 MIT 跟 Michael Jordan、贝尔实验室做博后。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "~2003 神经概率语言模型，引入词嵌入克服 NLP\"维度灾难\"——大模型的远祖。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "2014 与 Bahdanau、Cho 提出带注意力的神经机器翻译——注意力机制的关键源头之一。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "贡献涵盖去噪自编码器、GAN、注意力、learning to learn、生成流网络(GFlowNets)。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "1993 起任蒙特利尔大学教授；创办 Mila（魁北克 AI 研究所），任科学总监至 2025。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2016 共同创办 Element AI（孵化器），2020 卖给 ServiceNow。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "2025.11 成为首位 Google Scholar 引用破百万的 AI 学者；全球被引最高的计算机科学家、被引最高的在世科学家。(src: en.wiki)"}, {"id": "F9", "conf": "A", "t": "2023.3 签署\"暂停比 GPT-4 更强模型 6 个月\"公开信。(src: en.wiki)"}, {"id": "F10", "conf": "A", "t": "2023.5 自述对毕生工作感到\"迷失(lost)\"；7 月在《经济学人》撰文\"灾难风险已真实到需要现在就行动\"。(src: en.wiki)"}, {"id": "F11", "conf": "A", "t": "2023.11–2025.1 主持国际 AI 安全报告（2024.5 中期版、2025.1 完整版）。(src: en.wiki)"}, {"id": "F12", "conf": "A", "t": "2025.6 创办非营利 LawZero 做\"诚实\"AI 护栏；资助方含 FLI、Schmidt、Gates 基金会、加拿大政府。(src: en.wiki)"}, {"id": "F13", "conf": "A", "t": "2025.12 公开称\"给 AI 赋予权利将是巨大错误\"，安全要求保留随时关停的能力。(src: en.wiki)"}, {"id": "F14", "conf": "A", "t": "2018 图灵奖；2020 英国皇家学会院士；2023 法国荣誉军团勋章、联合国科学咨询委员；2024 TIME100。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "在寒冬期坚持冷门方向、不随主流摇摆", "from": "F2,F3", "cl": "CL2"}, {"id": "C2", "t": "持续产出被后人当作基础设施沿用的理论工具（词嵌入、注意力、GFlowNets）", "from": "F3,F4,F5", "cl": "CL3"}, {"id": "C3", "t": "把学术影响力做到\"全球被引第一/在世第一\"的极致量级", "from": "F8", "cl": "CL3"}, {"id": "C4", "t": "在自己推动的技术成功后公开自省\"迷失\"、并亲自下场建机构去做治理", "from": "F10,F11,F12", "cl": "CL14"}, {"id": "C5", "t": "能调动跨国政府与顶级基金会资源支持公共议题", "from": "F11,F12", "cl": "CL10"}, {"id": "C6", "t": "始终把研究锚在长期理论问题（因果、安全、GFlowNets）而非短期热点", "from": "F5,F12", "cl": "CL2"}, {"id": "C7", "t": "既创研究院(Mila)又创公司(Element AI)，机构建设能力多形态", "from": "F6,F7", "cl": "CL6"}, {"id": "C8", "t": "敢于持续公开表达与多数人不同的强烈风险判断并承担情绪/声誉成本", "from": "F9,F10,F13", "cl": "CL14"}]}, {"id": "F04", "name": "F04 Jeff Dean", "intro": "Google 首席科学家；大规模系统与 AI 基础设施。主要活跃窗口 1996–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1968.7.23 生于夏威夷；1990 明尼苏达大学 CS+经济学士(summa cum laude)，本科论文做神经网络；1996 华盛顿大学博士（程序优化）。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "读博前在 WHO 全球艾滋病规划署写 HIV/AIDS 流行病统计建模与预测软件——早年即用计算服务公共健康。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "1996 后入 DEC/Compaq 西部研究院，与 Sanjay Ghemawat 形成长期黄金搭档。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "1999 年中加入 Google，第 30 号员工。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "2004 MapReduce、2006 BigTable（均与 Ghemawat）、Spanner、Protocol Buffers、2011 LevelDB——撑起全 Google 的分布式基座。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "2011 进 Google X 研究深度网络，催生\"猫神经元\"论文（用 YouTube 数据无监督学出\"猫\"概念）。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2011/2012 组建并领导 Google Brain；做 DistBelief、TensorFlow、Pathways。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "主导自研 TPU，将神经网络推理成本降低约 10–30 倍，使现代 AI 经济上可行。(src: 多源)"}, {"id": "F9", "conf": "A", "t": "2018.4 任 Google AI 负责人；2023.4 Brain 与 DeepMind 合并为 Google DeepMind，任 Google 首席科学家；为 Gemini 命名并共同负责。(src: en.wiki)"}, {"id": "F10", "conf": "A", "t": "2009 美国国家工程院、ACM Fellow；2012 ACM 计算奖；2021 IEEE 冯·诺依曼奖；曾是 Google 仅有的两位 Senior Fellow 之一。(src: en.wiki)"}, {"id": "F11", "conf": "B", "t": "2020.12 Timnit Gebru、2021.2 Margaret Mitchell 离职风波中作为 AI 负责人发内部信，承认\"本可处理得更妥当\"——伦理治理上的争议。(src: en.wiki)"}, {"id": "F12", "conf": "B", "t": "2021.6 其署名的 Nature 强化学习芯片布局论文后被质疑方法与结果，引出诉讼。(src: en.wiki)"}, {"id": "F13", "conf": "A", "t": "与妻子设 Hopper-Dean 基金会，2016 向伯克利/MIT/UW/斯坦福/CMU 各捐 200 万美元推 STEM 多样性；天使投资 Perplexity、Sakana AI 等数十家。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "反复造出\"撑起整家巨头业务\"的底层系统（MapReduce/BigTable/Spanner）", "from": "F5", "cl": "CL3"}, {"id": "C2", "t": "把工程问题一路下沉到自研硬件层去解决（TPU 降本 10–30x）", "from": "F8", "cl": "CL5"}, {"id": "C3", "t": "二十年内完成从\"系统工程师\"到\"AI 科学家/统帅\"的范式自我重塑", "from": "F5,F7,F9", "cl": "CL9"}, {"id": "C4", "t": "长期靠一个稳定搭档(Ghemawat)放大产出（协作型而非孤胆型）", "from": "F3,F5", "cl": "CL0"}, {"id": "C5", "t": "既是顶尖个人贡献者又能统领大型研究组织", "from": "F7,F9", "cl": "CL6"}, {"id": "C6", "t": "用\"降低单位算力成本\"这一杠杆撬动整个行业的可行性", "from": "F8", "cl": "CL5"}, {"id": "C7", "t": "把技术能力外溢到公共健康/教育公益", "from": "F2,F13", "cl": "CL14"}, {"id": "C8", "t": "（边界）身处组织最高技术位时也会卷入伦理治理争议，被批处理不当", "from": "F11,F12", "cl": "CL16"}]}, {"id": "F05", "name": "F05 Ilya Sutskever", "intro": "OpenAI 前首席科学家、SSI 创始人兼 CEO。主要活跃窗口 2012–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1986 生于苏联高尔基市(犹太家庭)；5 岁移民以色列，16 岁(2002)赴加拿大插班多大三年级；2005 数学学士、2007 CS 硕士、2013 博士(师从 Hinton，论文做 RNN 训练)。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "2012 与 Krizhevsky、Hinton 共同创造 AlexNet。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "2012 在斯坦福随 Andrew Ng 做约两个月博后；2013 随 DNNResearch 被 Google 收购，入 Google Brain。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "2014 与 Vinyals、Le 提出 seq2seq；参与 TensorFlow；2016 AlphaGo 论文合著。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "联合创办 OpenAI 并任首席科学家，确立\"scaling 信仰\"；2023 牵头推理模型 o1 与\"超级对齐(Superalignment)\"。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "2022 发推\"今天的大型神经网络可能略有意识\"。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2023.11 作为董事投票罢免 Altman，写 52 页备忘录列领导问题；数日内表示后悔，随 Altman 复位退出董事会。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "2024.5 宣布离开 OpenAI（同日 Jan Leike 离职）。(src: en.wiki)"}, {"id": "F9", "conf": "A", "t": "2024.6 与 Daniel Gross、Daniel Levy 创办 Safe Superintelligence(SSI)，办公室在 Palo Alto 与特拉维夫。(src: en.wiki)"}, {"id": "F10", "conf": "A", "t": "2024.9 融 10 亿美元(a16z/红杉/DST 等)；2025.3 再融 20 亿、估值 320 亿；2025.6 拒绝 Meta 收购、Gross 转投 Meta，Ilya 出任 CEO。(src: en.wiki)"}, {"id": "F11", "conf": "A", "t": "理念：\"首款产品就是安全的超级智能，在那之前不做别的。\"(src: en.wiki)"}, {"id": "F12", "conf": "A", "t": "2022–2024 连续三年 NeurIPS Test of Time；2023/24 TIME100 AI；2026 美国科学院\"科学工业应用奖\"首次授予 AI；庭审确认其在 OpenAI 持股约 70 亿美元。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "在职业生涯多个关键拐点都恰好身处突破核心（AlexNet→seq2seq→GPT→o1）", "from": "F2,F4,F5", "cl": "CL17"}, {"id": "C2", "t": "把\"规模化\"从直觉变成一个组织的核心方法论", "from": "F5", "cl": "CL2"}, {"id": "C3", "t": "长期被同行验证的研究品味（连续三年 Test of Time）", "from": "F12", "cl": "CL3"}, {"id": "C4", "t": "为信念（安全/治理）不惜卷入剧烈组织冲突、写 52 页备忘录罢免 CEO，又能公开认错", "from": "F7", "cl": "CL14"}, {"id": "C5", "t": "仅凭信念+团队、无产品就能募得数十亿、撑起 320 亿估值", "from": "F10", "cl": "CL10"}, {"id": "C6", "t": "把抽象的\"安全超智能\"目标变成一家边界极清晰、拒绝被收购的公司", "from": "F9,F10,F11", "cl": "CL6"}, {"id": "C7", "t": "敢公开抛出\"模型或许略有意识\"这类高争议判断", "from": "F6", "cl": "CL15"}, {"id": "C8", "t": "跨语言/国家(俄→以→加)的极端早慧与流动性", "from": "F1", "cl": "CL8"}]}, {"id": "F06", "name": "F06 Demis Hassabis", "intro": "Google DeepMind 联合创始人兼 CEO、Isomorphic Labs 创始人。主要活跃窗口 1990s–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1976.7.27 生于伦敦，父希腊裔、母新加坡华裔；原姓 Hassapis(意为\"屠夫\")。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "4 岁看父叔下棋学会国象，13 岁达大师水平 Elo 2300；曾代表剑桥参加校际赛。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "16 岁提前两年考完 A-level；1994 在 Bullfrog 度 gap year；1997 剑桥皇后学院计算机本科 double first；2009 UCL 认知神经科学博士(导师 Eleanor Maguire，做情景记忆神经机制)。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "1994 17 岁与 Peter Molyneux 共同设计/主程《Theme Park》，售出数百万份；后在 Lionhead 做《Black & White》主 AI；1998 创办 Elixir Studios，2005 关闭。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "2007 PNAS 论文揭示海马损伤者无法想象未来——入选 Science 年度十大突破；在 MIT(Poggio)、Gatsby(Dayan) 做博后。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "2010 与 Shane Legg、Mustafa Suleyman 共同创办 DeepMind，招募 David Silver。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2013.12 DQN 在 Atari 游戏上突破；2014.1 Google 以约 4 亿英镑收购。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "AlphaGo：2015.10 胜樊麾 5–0、2016.3 胜李世石 4–1、2017 胜柯洁 3–0；后有 AlphaZero。(src: en.wiki)"}, {"id": "F9", "conf": "A", "t": "2020.11 AlphaFold2 在 CASP14 达 GDT 87.0、误差小于一个原子宽度——破解蛋白折叠。(src: en.wiki)"}, {"id": "F10", "conf": "A", "t": "2021 创办 Isomorphic Labs（AI 药物研发）。(src: en.wiki)"}, {"id": "F11", "conf": "A", "t": "2017 CBE、皇家学会院士(2018)；2018 任英国政府 AI 顾问；2023 Lasker、Gairdner、生命科学突破奖；2024 诺贝尔化学奖(与 Jumper)、获封爵士。(src: en.wiki)"}, {"id": "F12", "conf": "A", "t": "2023 签署\"AI 灭绝风险应与流行病/核战并列为全球优先\"声明——既乐观又承认风险。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "把神经科学的\"大脑学习方式/记忆机制\"直接迁移成 AI 训练范式", "from": "F3,F5,F8", "cl": "CL4"}, {"id": "C2", "t": "横跨国象/游戏设计/神经科学/AI 多个领域并都做到顶尖", "from": "F2,F4,F5", "cl": "CL4"}, {"id": "C3", "t": "选择\"有里程碑意义的标志性问题\"作为攻坚目标（围棋→蛋白折叠）", "from": "F8,F9", "cl": "CL11"}, {"id": "C4", "t": "把一项 AI 突破推到改变一整门自然科学(结构生物学)的程度", "from": "F9,F11", "cl": "CL3"}, {"id": "C5", "t": "长期运营世界级研究机构并兼顾科学与商业(DeepMind+Isomorphic)", "from": "F6,F10", "cl": "CL6"}, {"id": "C6", "t": "早年用游戏/创业积累资本与工程力，再回炉读神经科学博士、跨周期布局", "from": "F4,F3,F6", "cl": "CL9"}, {"id": "C7", "t": "用\"通用学习智能体\"长期愿景(DQN→AlphaZero)一以贯之地组织研究", "from": "F7,F8", "cl": "CL11"}, {"id": "C8", "t": "同时持乐观与风险两端、并进入政府决策层", "from": "F11,F12", "cl": "CL14"}]}, {"id": "F07", "name": "F07 Sam Altman", "intro": "OpenAI 联合创始人兼 CEO。主要活跃窗口 2005–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1985.4.22 生于芝加哥；8 岁得到 Mac 开始编程；17 岁高中出柜（同性恋）。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "2003 入斯坦福读 CS，两年后辍学；2005(19 岁)联合创办定位社交 Loopt，募资 3000 万+(含红杉、YC)；2012.3 以 4340 万美元卖给 Green Dot。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "2012 与弟弟创办 Hydrazine Capital，首期 2100 万美元、75% 投向 YC 公司——很早展现投资人身份。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "2011 加入 YC 任合伙人；2014.2 接替 Paul Graham 任总裁；2019.3 离开全职做 OpenAI。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "2015 与 Musk、Brockman、Thiel 等共同创办 OpenAI（非营利，承诺 10 亿）；2019 任 CEO。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "2022.12 发布 ChatGPT，5 天内百万注册；2023.5 国会作证、22 国\"世界巡访\"会见马克龙/苏纳克/莫迪等。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2023.11.17 董事会(Toner/D'Angelo/McCauley/Sutskever)以\"沟通不够坦诚\"罢免他；11.20 纳德拉宣布他将加入微软；同日 505→700+/770 员工联名威胁集体出走；11.21 他与 Brockman 回归，新董事会由 Bret Taylor 任主席。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "2019 创办 Tools for Humanity/Worldcoin（虹膜身份+加密货币），到 2023 募 2.5 亿、扫描 200 万只眼，在法/英/西/韩等地遭监管暂停。(src: en.wiki)"}, {"id": "F9", "conf": "A", "t": "任 Helion(核聚变)主席；投资 Retro Biosciences(1.8 亿,抗衰)、Oklo(核裂变)、Reddit(曾第三大股东 9%)、Stripe、Airbnb 等；2024 净资产约 20 亿美元、投资组合 400+ 公司。(src: en.wiki)"}, {"id": "F10", "conf": "A", "t": "倡导全民基本收入；2021《Moore's Law for Everything》提议十年内每人每年 13500 美元 UBI；后又提\"全民基本算力\"。(src: en.wiki)"}, {"id": "F11", "conf": "B", "t": "2024.5 前董事 Toner 称其隐瞒信息、两高管报告\"心理虐待\"；Loopt 管理层曾两度试图以\"欺骗与混乱行为\"罢免他——长期被质疑可信度。(src: en.wiki)"}, {"id": "F12", "conf": "B", "t": "2025.1 其妹 Ann 起诉指控童年性侵，本人与家人联合否认。(src: en.wiki)"}, {"id": "F13", "conf": "A", "t": "自述是\"末日准备者\"(prepper)，囤枪、黄金、防毒面具、Big Sur 大片土地。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "极早期(19 岁)就敢创业并募得大额资本、且很早兼具投资人视角", "from": "F2,F3", "cl": "CL10"}, {"id": "C2", "t": "从加速器/投资视角系统性识别并放大早期创业者", "from": "F3,F4", "cl": "CL10"}, {"id": "C3", "t": "把一项研究成果转化为现象级消费产品并定义一个时代", "from": "F6", "cl": "CL5"}, {"id": "C4", "t": "在被董事会逐出后数日内重夺控制权（罕见的组织与联盟动员力）", "from": "F7", "cl": "CL10"}, {"id": "C5", "t": "同时下注多条长周期高不确定赌局（核聚变/核裂变/身份/抗衰/AGI）", "from": "F8,F9", "cl": "CL11"}, {"id": "C6", "t": "持续撬动史上罕见量级的资本投入单一愿景", "from": "F5,F6", "cl": "CL10"}, {"id": "C7", "t": "把个人理念上升为公共政策提案（UBI、全民算力）", "from": "F10", "cl": "CL14"}, {"id": "C8", "t": "（边界）多个独立来源指其\"沟通不坦诚\"，强动员力与信任质疑并存", "from": "F7,F11", "cl": "CL16"}, {"id": "C9", "t": "用极端风险意识(prepper)管理不确定性", "from": "F13", "cl": "CL16"}]}, {"id": "F08", "name": "F08 Dario Amodei", "intro": "Anthropic 联合创始人兼 CEO。主要活跃窗口 2010s–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1983 生于旧金山；2000 入选美国物理奥赛队；Caltech 起步随物理学家 Tombrello，斯坦福物理学士，普林斯顿生物物理硕博(2011，做\"网络尺度电生理\")，斯坦福医学院博后。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "2014.11–2015.10 百度；2015–16 Google；2016 加入 OpenAI 任研究副总裁，深度参与 scaling laws、RLHF、GPT-2/GPT-3。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "2021 与妹妹 Daniela 及多名 OpenAI 资深成员因路线分歧出走，共同创办 Anthropic（公益公司 PBC，做 Claude）。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "2023.11 OpenAI 董事会曾找他接替 Altman/合并，被他拒绝。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "截至 2026.5 Anthropic 估值约 9650 亿美元，其个人净资产约 70 亿。(src: en.wiki/Forbes)"}, {"id": "F6", "conf": "A", "t": "2024.10《Machines of Loving Grace》：\"多数人低估了 AI 上行潜力有多激进\"；主张民主国家用 AI 取得优势并共享(\"entente\"策略)。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2026.1《The Adolescence of Technology》提出五类 AI 风险：失准、生物武器、威权监控/武器、大规模失业、未知影响。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "2026.2 拒绝国防部要求其撤掉 Claude 关于\"禁止大规模国内监控/全自主武器\"的合同条款；2026.2.27 特朗普政府令各机构停用 Claude、将 Anthropic 列为\"供应链风险\"；2026.3.26 联邦法官发临时禁令，认定 DoD 行为像\"典型第一修正案报复\"。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "把\"规模决定能力\"从经验上升为可指导研发的定律(scaling laws)", "from": "F2", "cl": "CL3"}, {"id": "C2", "t": "用跨学科(物理/生物物理)的量化直觉切入 AI", "from": "F1", "cl": "CL4"}, {"id": "C3", "t": "因价值观分歧敢带团队出走、另立一套组织范式(公益公司)", "from": "F3", "cl": "CL6"}, {"id": "C4", "t": "把\"安全/可控/可解释\"作为差异化定位去建公司而非口号", "from": "F3,F6,F7", "cl": "CL14"}, {"id": "C5", "t": "同时持有\"风险极大\"与\"上行极大\"两端并系统化公开表达", "from": "F6,F7", "cl": "CL14"}, {"id": "C6", "t": "在极短时间把新公司带到全球最高估值梯队", "from": "F5", "cl": "CL10"}, {"id": "C7", "t": "为产品的伦理红线不惜与最大政府客户公开对抗", "from": "F8", "cl": "CL14"}, {"id": "C8", "t": "拒绝唾手可得的权力(接替 Altman)、坚持走自己的路", "from": "F4", "cl": "CL2"}]}, {"id": "F09", "name": "F09 Andrej Karpathy", "intro": "深度学习教育者；前 Tesla AI 总监、前 OpenAI、现 Anthropic。主要活跃窗口 2011–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1986.10.23 生于斯洛伐克 Bratislava，15 岁(2001)移居多伦多；多大 CS+物理本科(2009)、UBC 硕士(物理仿真角色, 2011)、2015 斯坦福博士(师从李飞飞，NLP+视觉)。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "2015 设计并主讲斯坦福首门深度学习课 CS231n，选课 150(2015)→750(2017)。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "2006 起经营 YouTube 频道 badmephisto(魔方教程, 900 万+ 观看)——长期的\"科普表达\"基因；2023 起做神经网络教学(Zero to Hero、micrograd、nanoGPT、llm.c)。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "2015.12 OpenAI 创始成员(2015–17 研究科学家)。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "2017.6 任 Tesla AI 与 Autopilot 视觉总监，直接向 Musk 汇报，主导自动驾驶视觉(2017–2022)。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "2023.2 重返 OpenAI，2024.2 再离开；2024.7 创办 AI 教育平台 Eureka Labs(LLM101n)；2026.5 加入 Anthropic 任预训练团队负责人。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "提出\"Software 2.0\"(神经网络是新编程范式)；2025.2 造词\"vibe coding\"(用自然语言+AI 工具搭应用)——定义了行业流行语。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "2020 MIT TR35；2024 TIME100 AI。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "把复杂系统拆成人人能懂的最小可教单元(从魔方到 nanoGPT)——长期一致的教学天赋", "from": "F2,F3", "cl": "CL12"}, {"id": "C2", "t": "用开源极简实现(micrograd/nanoGPT/llm.c)影响整代工程师", "from": "F3", "cl": "CL12"}, {"id": "C3", "t": "在研究、量产工程(自动驾驶)、教育之间自由切换并都做到顶尖", "from": "F4,F5,F6", "cl": "CL9"}, {"id": "C4", "t": "把前沿模型落到真实物理系统(车)的工程化", "from": "F5", "cl": "CL5"}, {"id": "C5", "t": "主动选择\"做教育/科普\"这种高杠杆而非高职位的路径", "from": "F3,F6", "cl": "CL12"}, {"id": "C6", "t": "持续被多家顶级机构争抢(OpenAI→Tesla→OpenAI→Anthropic)", "from": "F4,F5,F6", "cl": "CL9"}, {"id": "C7", "t": "善于\"造词\"为新现象命名、塑造行业话语(Software 2.0、vibe coding)", "from": "F7", "cl": "CL15"}]}, {"id": "F10", "name": "F10 Chris Olah", "intro": "Anthropic 联合创始人、机制可解释性开创者。主要活跃窗口 2013–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1992/93 生于加拿大；18 岁离开大学、无学位；获 Thiel Fellowship 支持独立研究——靠作品而非文凭立足。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "在 Google Brain 做可解释性，参与 2015 DeepDream 神经网络可视化。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "转 OpenAI 领导可解释性；2019 与 Google 合作\"activation atlases\"。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "共同创办 Distill（强调把研究讲清楚的出版物）。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "2021 联合创办 Anthropic，领导映射大模型内部\"特征(features)\"的工作；机制可解释性(circuits、superposition、Transformer Circuits、字典学习、Golden Gate Claude)开创者。(src: en.wiki/Time)"}, {"id": "F6", "conf": "A", "t": "2024 TIME100 AI；2025 因持股成为亿万富翁。(src: Forbes)"}, {"id": "F7", "conf": "A", "t": "2026.5 在梵蒂冈教皇 Leo XIV 通谕发布会发言，警告\"AI 或致大规模劳动替代\"，呼吁宗教/公民社会提供外部道德监督。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "不靠学历体制、靠作品自证进入并领跑一个领域", "from": "F1,F5", "cl": "CL8"}, {"id": "C2", "t": "几乎独力开辟并定义一个新研究方向(机制可解释性)", "from": "F5", "cl": "CL3"}, {"id": "C3", "t": "把\"把复杂结果讲清楚\"本身当作研究基础设施去建(Distill)", "from": "F4", "cl": "CL12"}, {"id": "C4", "t": "用可视化把神经网络\"黑箱\"变成可观察对象(DeepDream→activation atlas→features)", "from": "F2,F3,F5", "cl": "CL3"}, {"id": "C5", "t": "同一执念跨三家顶级机构持续深耕十余年", "from": "F2,F3,F5", "cl": "CL1"}, {"id": "C6", "t": "把技术议题带入更广的道德/社会场域(梵蒂冈发言)", "from": "F7", "cl": "CL14"}]}, {"id": "F11", "name": "F11 Andrew Ng 吴恩达", "intro": "AI 教育与产业落地代表；Google Brain/Coursera/Baidu/DeepLearning.AI。主要活跃窗口 2002–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1976.4.18 生于伦敦，1984 举家迁新加坡；CMU 本科(CS+统计+经济三主修)、MIT 硕士、2002 伯克利博士(师从 Michael Jordan，做强化学习)。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "2002 起斯坦福助理教授；2000s 初领导斯坦福自主直升机项目；2008 其组率先把 GPU 用于深度学习。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "任 SAIL 主任；CS229 是校内最受欢迎课(年逾千人)；合著 LDA(隐狄利克雷分配)经典论文；STAIR 项目影响了 ROS 机器人操作系统。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "2011 与 Jeff Dean 等创办 Google Brain；著名\"1.6 万 CPU 核从 YouTube 学出猫\"实验。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "2014–2017 任百度首席科学家，做 DuerOS、人脸识别、医疗对话 Melody。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "2008 起 Stanford Engineering Everywhere；2011.10 ml-class.org 首发即 10 万+ 注册。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2012 与 Daphne Koller 共同创办 Coursera 任 CEO；其两门课长期是 Coursera 最热门第一、第二名；到 2023 累计约 800 万学生。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "2017 创办 DeepLearning.AI、Landing AI；2018 设 AI Fund(1.75 亿美元)系统性孵化 AI 公司。(src: en.wiki)"}, {"id": "F9", "conf": "A", "t": "2024.4 入亚马逊董事会；2009 IJCAI Computers and Thought 奖；2013 TIME100(37 岁)。(src: en.wiki)"}, {"id": "F10", "conf": "A", "t": "理念：\"AI 是新的电力\"；强调劳动力冲击需各界对话、反对炒作\"杀手机器人\"、支持开源、主张监管不应扼杀创新。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "把高门槛技术做成超大规模可触达的教育产品（800 万学生）", "from": "F6,F7", "cl": "CL12"}, {"id": "C2", "t": "在学术、巨头研究院、创业、投资多种角色间反复成功切换", "from": "F2,F4,F5,F8", "cl": "CL9"}, {"id": "C3", "t": "既创立顶级研究项目(Google Brain)又创立教育平台(Coursera)——多形态从零建起", "from": "F4,F7", "cl": "CL6"}, {"id": "C4", "t": "早早押注新工程要素（2008 用 GPU 训练深度网络）", "from": "F2", "cl": "CL17"}, {"id": "C5", "t": "用\"AI 是新电力\"等清晰框架对抗炒作、强调可工程化落地", "from": "F10", "cl": "CL15"}, {"id": "C6", "t": "以投资/孵化方式系统性批量制造 AI 公司", "from": "F8", "cl": "CL10"}, {"id": "C7", "t": "持续把自己塑造成连接前沿与大众的\"翻译层\"", "from": "F6,F7,F10", "cl": "CL12"}]}, {"id": "F12", "name": "F12 Fei-Fei Li 李飞飞", "intro": "斯坦福教授、ImageNet 发起者、HAI 联合主任、World Labs 创始人。主要活跃窗口 2007–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1976.7.3 生于北京，长于成都(成都七中)；16 岁(1992)随母赴美与父团聚；高中周末在家庭干洗店打工。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "1999 普林斯顿物理学士；2001 Caltech 电子工程硕士、2005 博士(视觉识别计算模型与人类心理物理)。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "2007 在普林斯顿期间发起 ImageNet——1400 万+ 标注图像的大数据库；2010–2017 办 ILSVRC 挑战赛，催化深度学习爆发。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "核心判断：当时瓶颈在\"训练数据\"而非模型，故押注造数据集。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "2009 入斯坦福；2013–2018 任 SAIL 主任；2018 升正教授；与 Etchemendy 共同创办 HAI。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "2020 同年入选美国国家工程院与国家医学院；2021 入艺术与科学院。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2017.1–2018 任 Google Cloud AI/ML 首席科学家兼副总裁；遇 Project Maven(五角大楼无人机影像)争议，泄露邮件显示她警告勿张扬 AI 成分；公开表态\"把 AI 武器化深违我的原则\"；2018.6 Google 宣布不续约。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "2015 办 SAILORS(九年级女生 AI 夏令营)；2017 与 Melinda French Gates、黄仁勋共同创办 AI4ALL。(src: en.wiki)"}, {"id": "F9", "conf": "A", "t": "2024 创办 World Labs 攻\"空间智能\"(3D 世界推理)；2024.9 种子轮 2.3 亿美元，估值超 10 亿。(src: en.wiki)"}, {"id": "F10", "conf": "A", "t": "2023 出版回忆录《The Worlds I See》；发表论文 300+；2025 TIME\"AI 缔造者\"、女王工程奖。(src: en.wiki)"}, {"id": "F11", "conf": "A", "t": "理念：\"以人为本的 AI\"；\"AI 治理应基于科学而非科幻\"。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "在主流追求模型/算法时，逆向押注\"数据本身\"才是瓶颈(ImageNet)", "from": "F3,F4", "cl": "CL2"}, {"id": "C2", "t": "组织一项需海量众包标注的大工程并坚持做完、还做成长期基准赛", "from": "F3", "cl": "CL11"}, {"id": "C3", "t": "为下一个范式(空间智能)提前定义新方向并创业", "from": "F9", "cl": "CL11"}, {"id": "C4", "t": "把\"以人为本/伦理\"建制化(HAI、AI4ALL)而非停留口号", "from": "F5,F8", "cl": "CL14"}, {"id": "C5", "t": "在巨头内遇军事化项目时以原则公开划线、承受组织代价", "from": "F7", "cl": "CL14"}, {"id": "C6", "t": "学术、建制、创业、公共倡导、写作多线并行", "from": "F5,F9,F10", "cl": "CL9"}, {"id": "C7", "t": "寒门移民出身仍登顶学界并跨入三大国家科学院", "from": "F1,F6", "cl": "CL16"}, {"id": "C8", "t": "物理出身、转入视觉，用跨学科视角重定义问题", "from": "F2,F3", "cl": "CL4"}]}, {"id": "F13", "name": "F13 黄学东 (Xuedong Huang)", "intro": "微软语音 AI 长期负责人、前微软全球 AI CTO、现 Zoom CTO。主要活跃窗口 1990s–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1962 生于武汉、长于长沙；1978(15 岁)从高一直接考入湖南大学计算机本科；1984 清华硕士；1989 爱丁堡大学博士。(src: 维基/新浪)"}, {"id": "F2", "conf": "A", "t": "1992 领导 CMU 语音识别项目 Sphinx-II，实现业界最低错误率，刷新 DARPA 评估降错速度纪录。(src: 多源)"}, {"id": "F3", "conf": "A", "t": "1993 加入微软，组建语音技术组；1995 主导研发业界首个语音 API(SAPI)，让语音技术进入数百万 Windows 应用。(src: 多源)"}, {"id": "F4", "conf": "A", "t": "2016 带队在 Switchboard 对话语音识别上达到人类水平(错误率~5.9%)，宣称首次\"与人类持平\"。(src: 多源)"}, {"id": "F5", "conf": "A", "t": "在微软主持三十余年语音 AI，并统领计算机视觉、语音合成、NLP、机器翻译，直至 Azure OpenAI/ChatGPT 服务。(src: 多源)"}, {"id": "F6", "conf": "A", "t": "2017 ACM Fellow、2020 IEEE Fellow；2020 任微软全球 AI CTO，是微软首位华人技术院士；2023 同时当选美国国家工程院与艺术与科学院两院院士。(src: 多源)"}, {"id": "F7", "conf": "A", "t": "持有 170+ 美国专利，发表 100+ 论文、2 本著作。(src: 多源)"}, {"id": "F8", "conf": "A", "t": "2023 离开微软(30 年)，任 Zoom 全球 CTO，瞄准 AI+AR。(src: 多源)"}], "caps": [{"id": "C1", "t": "把单点技术(语音识别)反复做到刷新行业纪录/与人类持平的极致", "from": "F2,F4", "cl": "CL3"}, {"id": "C2", "t": "把研究成果产品化为开发者接口/平台(SAPI 进数百万应用)", "from": "F3", "cl": "CL5"}, {"id": "C3", "t": "在一家巨头内三十年持续处于核心并不断扩展统辖范围", "from": "F3,F5", "cl": "CL1"}, {"id": "C4", "t": "兼具顶尖工程产出与院士级学术地位(170 专利 + 两院院士)", "from": "F6,F7", "cl": "CL3"}, {"id": "C5", "t": "极早慧(15 岁上大学)且持续高产数十年", "from": "F1", "cl": "CL8"}, {"id": "C6", "t": "资深后仍敢转场新平台押注新形态(AI+AR)", "from": "F8", "cl": "CL9"}, {"id": "C7", "t": "把一条垂直能力(语音)一路带到大模型/ChatGPT 服务时代", "from": "F5", "cl": "CL5"}]}, {"id": "F14", "name": "F14 沈向洋 (Harry Shum)", "intro": "前微软全球执行副总裁、IDEA/清华 AIR 创始人、港科大校董会主席。主要活跃窗口 1996–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1966.10 生于江苏溧水；1996 在 CMU 获机器人/计算机视觉博士。(src: 维基)"}, {"id": "F2", "conf": "B", "t": "由陆奇引荐进入微软雷德蒙总部研究院；1998 转入刚成立的微软亚洲研究院(MSRA)，2004 任院长兼首席科学家——MSRA 被称\"中国 AI 黄埔军校\"。(src: 量子位/维基)"}, {"id": "F3", "conf": "A", "t": "2007 起任微软全球资深副总裁、必应搜索负责人等；2013.11 任微软全球执行副总裁，直接向 CEO 汇报，是微软级别最高的华人。(src: 维基)"}, {"id": "F4", "conf": "A", "t": "计算机视觉/图形学世界级专家，发表论文 200+、美国专利 50+；曾任 ICCV 主席等。(src: 维基)"}, {"id": "F5", "conf": "A", "t": "美国国家工程院(2017)、英国皇家工程院(2018)院士；与人合著《计算机视觉》经典教材。(src: 维基)"}, {"id": "F6", "conf": "A", "t": "2019.11 宣布离开微软；2020.3 受聘清华高研院双聘教授并创办智能产业研究院(AIR)；2020.11 创办粤港澳大湾区数字经济研究院(IDEA)任创院理事长；并主导微软小冰分拆独立任董事长。(src: 多源)"}, {"id": "F7", "conf": "A", "t": "2023.3 任香港科技大学校董会主席；2026.3 任香港人工智能研发院董事局主席。(src: 维基)"}], "caps": [{"id": "C1", "t": "把一个海外研究院建成持续输出领军人才的\"人才发动机\"(MSRA)", "from": "F2", "cl": "CL7"}, {"id": "C2", "t": "在跨国巨头爬到华人最高管理层(兼具技术与组织领导)", "from": "F3", "cl": "CL9"}, {"id": "C3", "t": "顶尖科研(视觉/图形)与大型组织治理两手都硬", "from": "F2,F4", "cl": "CL6"}, {"id": "C4", "t": "功成后回到大中华区，把经验转化为多个新研究机构与人才生态", "from": "F6,F7", "cl": "CL6"}, {"id": "C5", "t": "反复扮演\"机构创建者/掌舵者\"角色(MSRA→AIR→IDEA→小冰→港科大→港 AI 院)", "from": "F2,F6,F7", "cl": "CL6"}, {"id": "C6", "t": "善于识别、引荐与培养人才、构建关系网络(自身由陆奇引荐，又育大量后辈)", "from": "F2", "cl": "CL7"}, {"id": "C7", "t": "把成熟业务(小冰)分拆独立、给新形态让路", "from": "F6", "cl": "CL11"}]}, {"id": "F15", "name": "F15 周志华", "intro": "南京大学教授、LAMDA 负责人、人工智能学院院长。主要活跃窗口 1996–至今。", "facts": [{"id": "F1", "conf": "A", "t": "1996(本)、1998(硕)、2000.12(博) 均在南京大学计算机系完成——纯本土培养的学者。(src: 多源)"}, {"id": "F2", "conf": "A", "t": "2001.1 留校；2002 破格升副教授；2003 获国家杰出青年基金；2004 升教授+博导；2006 长江学者特聘教授。(src: 多源)"}, {"id": "F3", "conf": "A", "t": "集成学习/选择性集成、Boosting margin 理论的代表性研究者。(src: 多源)"}, {"id": "F4", "conf": "A", "t": "2008 在 IEEE ICDM 提出孤立森林(Isolation Forest)——被工业界广泛用于异常检测。(src: 多源)"}, {"id": "F5", "conf": "A", "t": "2017 与学生冯霁提出深度森林 gcForest（多粒度级联森林），主张\"深度模型不必是神经网络\"，可小数据、易训练。(src: 多源)"}, {"id": "F6", "conf": "A", "t": "提出反绎学习/溯因学习(abductive learning)，把机器学习与一阶逻辑推理结合。(src: IJCAI)"}, {"id": "F7", "conf": "A", "t": "2016 提出\"学件\"(learnware)范式——构建可复用模型市场，避免从零训练；2023 开源实现\"北冥坞\"(Beimingwu)。(src: 多源)"}, {"id": "F8", "conf": "A", "t": "著《机器学习》(西瓜书)，2016 问世后被海内外 500+ 高校院系用作教材，已出英、日、韩文版——本土学者向世界\"科教输出\"。(src: 雷峰网)"}, {"id": "F9", "conf": "A", "t": "发表论文 200+，Google Scholar 引用 8 万+，多次入选 Elsevier 高被引学者。(src: 多源)"}, {"id": "F10", "conf": "A", "t": "2018 起任南京大学人工智能学院院长（中国 C9 高校首个 AI 学院之一）。(src: 多源)"}, {"id": "F11", "conf": "A", "t": "2023.8 当选 IJCAI 理事会主席——大陆学者首次、全球华人第二（继杨强）。(src: 量子位)"}, {"id": "F12", "conf": "A", "t": "AAAI/AAAS/ACM/IEEE/IAPR 等多个学会 Fellow、欧洲科学院院士。(src: 多源)"}], "caps": [{"id": "C1", "t": "纯本土环境下做到国际顶级、不依赖海外镀金", "from": "F1,F11", "cl": "CL8"}, {"id": "C2", "t": "在深度学习一统天下时，公开押注\"非神经网络的深度模型\"这条逆向路线", "from": "F5", "cl": "CL2"}, {"id": "C3", "t": "反复提出\"自成体系的新范式\"而非跟随热点（学件、反绎学习、深度森林）", "from": "F5,F6,F7", "cl": "CL3"}, {"id": "C4", "t": "做出被工业界长期默默使用的标准算法（孤立森林）", "from": "F4", "cl": "CL3"}, {"id": "C5", "t": "用一本教材定义了一个国家整代人的入门路径并反向输出到海外", "from": "F8", "cl": "CL12"}, {"id": "C6", "t": "从单点研究者成长为学院/国际学会的建制领导者", "from": "F10,F11", "cl": "CL6"}, {"id": "C7", "t": "把\"知识/逻辑推理\"与\"数据学习\"两条传统强行缝合", "from": "F6", "cl": "CL3"}]}, {"id": "F16", "name": "F16 朱军", "intro": "清华大学计算机系教授、人工智能研究院副院长、RealAI 首席科学家。主要活跃窗口 2000s–至今。", "facts": [{"id": "F1", "conf": "A", "t": "2001–2009 在清华完成本硕博（计算机系），师从张钹院士；曾任 CMU 兼职教授。(src: 清华校友)"}, {"id": "F2", "conf": "A", "t": "研究方向：概率机器学习——贝叶斯方法、深度生成模型、深度学习、强化学习。(src: 多源)"}, {"id": "F3", "conf": "A", "t": "提出最大熵判别学习的 PAC-Bayes 理论、正则化贝叶斯理论、贝叶斯模型的最大间隔学习。(src: 多源)"}, {"id": "F4", "conf": "A", "t": "课题组是国际最早研究深度概率生成模型的团队之一。(src: 多源)"}, {"id": "F5", "conf": "A", "t": "开发\"珠算\"(ZhuSuan) 可微概率编程库、\"天授\"(Tianshou) 强化学习库——开源基础设施。(src: 中国科学/多源)"}, {"id": "F6", "conf": "A", "t": "与张钹合作《Analytic-DPM》(扩散模型最优方差解析估计) 获 ICLR 2022 杰出论文奖。(src: 多源)"}, {"id": "F7", "conf": "A", "t": "团队 2023 开源 UniDiffuser——首个基于 Transformer 的多模态扩散大模型(U-ViT 架构, LAION-5B 训练, 十亿参数)，可文图互生。(src: 多源)"}, {"id": "F8", "conf": "A", "t": "2017 带队在 NIPS 对抗样本攻防竞赛中包揽三项冠军——对抗安全方向代表性团队。(src: 腾讯云)"}, {"id": "F9", "conf": "A", "t": "2018.7 参与发起瑞莱智慧(RealAI)，与张钹同任首席科学家，CEO 为清华博士田天；聚焦可解释、对抗攻防的\"第三代 AI\"，做 AI 杀毒平台 RealSafe。(src: 36氪/机器之心)"}, {"id": "F10", "conf": "A", "t": "发表论文 200+，Google Scholar 引用 5 万+；连续多年任 ICML、NeurIPS 领域主席；IEEE/AAAI Fellow；MIT TR35 中国入选者。(src: 多源)"}], "caps": [{"id": "C1", "t": "在深度学习浪潮中坚守\"贝叶斯/概率\"传统并将其与深度学习融合", "from": "F2,F3,F4", "cl": "CL2"}, {"id": "C2", "t": "把理论研究沉淀成可复用的开源工具库（珠算、天授）", "from": "F5", "cl": "CL13"}, {"id": "C3", "t": "顶尖理论（ICLR 杰出论文）与前沿大模型工程（UniDiffuser）两端通吃", "from": "F6,F7", "cl": "CL5"}, {"id": "C4", "t": "在主流追新时押注\"安全/对抗/可解释\"这一第三代 AI 方向", "from": "F8,F9", "cl": "CL14"}, {"id": "C5", "t": "由院士师门出身，再把学术成果产业化建公司", "from": "F1,F9", "cl": "CL6"}, {"id": "C6", "t": "用竞赛夺冠的方式为新方向（对抗安全）确立团队声誉", "from": "F8", "cl": "CL3"}]}, {"id": "F17", "name": "F17 汤晓鸥", "intro": "香港中文大学教授、商汤科技创始人、上海 AI 实验室主任。1968–2023。", "facts": [{"id": "F1", "conf": "A", "t": "1968.1.24 生于辽宁鞍山；1990 中科大本科、1991 罗彻斯特大学硕士、1996 MIT 博士。(src: 维基/多源)"}, {"id": "F2", "conf": "B", "t": "2005–2008 曾任职微软亚洲研究院。(src: 维基)"}, {"id": "F3", "conf": "A", "t": "2001 创建港中文多媒体实验室（商汤前身），2016 与 MIT/斯坦福等并列入选\"世界十大 AI 先锋实验室\"、亚洲唯一。(src: 多源)"}, {"id": "F4", "conf": "A", "t": "发表论文 400+；福布斯称其为\"中国人脸识别技术背后的面孔\"。(src: 多源)"}, {"id": "F5", "conf": "A", "t": "2014.3 团队 GaussianFace 在 LFW 上达 98.52%，全球首次在人脸识别上超越人眼。(src: 多源)"}, {"id": "F6", "conf": "A", "t": "2014.6 起 DeepID 系列把准确率逐步提到 99.55%，实验室三个算法占据 LFW 前三，Facebook DeepFace 仅第四——开启人脸识别落地时代。(src: 多源)"}, {"id": "F7", "conf": "A", "t": "2014.10 与学生徐立等创办商汤；2014.8 获 IDG 数千万美元 A 轮，2015 获 StarVC A+ 轮。(src: IDG/多源)"}, {"id": "F8", "conf": "A", "t": "2021.12.30 商汤港交所上市，发行价 3.85 港元，募资 57.75 亿港元，成为全球 AI 领域最大 IPO，市值一度破千亿（约 1444 亿港元）。(src: 量子位/多源)"}, {"id": "F9", "conf": "A", "t": "上市前三年半研发开支近 70 亿元；商汤后亦经历巨额亏损（被指\"高估深度学习\"）。(src: 证券时报)"}, {"id": "F10", "conf": "A", "t": "培养 134+ 学生；博士生何恺明 2015 以一作发表 ResNet；徐立(CEO)、王晓刚、徐冰等均出其门下，\"三名弟子扛起 400 亿商汤\"。(src: 网易/21经济)"}, {"id": "F11", "conf": "A", "t": "同时任上海人工智能实验室主任、浦江实验室主任、香港特首顾问团成员。(src: 维基)"}, {"id": "F12", "conf": "A", "t": "2023.12.15 因病逝世，享年 55 岁；2024.3 商汤年会以数字人形式\"复现\"其脱口秀。(src: 多源)"}], "caps": [{"id": "C1", "t": "横跨中科大/罗彻斯特/MIT，把世界级训练带回亚洲建实验室", "from": "F1,F3", "cl": "CL6"}, {"id": "C2", "t": "在一个具体能力（人脸识别）上做到全球首次超越人眼的硬突破", "from": "F5,F6", "cl": "CL3"}, {"id": "C3", "t": "把实验室论文直接裂变为一家上市独角兽（学术→商业的极致转化）", "from": "F3,F7,F8", "cl": "CL5"}, {"id": "C4", "t": "作为\"师父\"批量孵化顶级人才与高管，用人才网络支撑整家公司", "from": "F10", "cl": "CL7"}, {"id": "C5", "t": "既做最前沿研究又长期承担国家级科研机构治理（上海 AI Lab）", "from": "F11", "cl": "CL6"}, {"id": "C6", "t": "敢在早期重注一条尚未被验证的商业路线并撬动顶级资本", "from": "F7,F8", "cl": "CL10"}, {"id": "C7", "t": "（边界/失败信号）高估单一技术路线的商业化、后续巨亏——成功者也会误判", "from": "F9", "cl": "CL16"}]}, {"id": "F18", "name": "F18 张钹", "intro": "清华大学教授、中国科学院院士、清华 AI 研究院名誉院长。1935 生。", "facts": [{"id": "F1", "conf": "A", "t": "1935.3.26 生于福建福清；1953 以数理化满分入清华电机系，1956 转自动控制；1958 毕业留校任教。(src: 维基/百科)"}, {"id": "F2", "conf": "A", "t": "1980–1982 赴美伊利诺伊大学做访问学者，弥补文革造成的知识断层。(src: 维基)"}, {"id": "F3", "conf": "A", "t": "1978 在清华率先设立\"人工智能与智能控制\"教研组——中国最早之一。(src: 多源)"}, {"id": "F4", "conf": "A", "t": "1985 领衔成立中国首个智能机器人实验室。(src: 多源)"}, {"id": "F5", "conf": "A", "t": "1990 与同事联合成立中国首个 AI 国家重点实验室\"智能技术与系统\"，并任主任(1990–1996)。(src: 多源)"}, {"id": "F6", "conf": "A", "t": "1994 当选俄罗斯自然科学院外籍院士；1995 当选中国科学院院士。(src: 维基)"}, {"id": "F7", "conf": "A", "t": "长期研究 AI、人工神经网络、遗传 ", "conf": "A", "t": "2023.3 签署\"暂停比 GPT-4 更强模型 6 个月\"公开信(逾 3 万签名)；2025.1 撰文\"AGI 竞赛是冲向悬崖边的竞赛\"。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "创办并领导国际安全与伦理 AI 协会(IASEAI)。(src: en.wiki)"}, {"id": "F9", "conf": "A", "t": "1995 IJCAI Computers and Thought、2022 IJCAI 卓越研究奖(史上第二人两奖通吃)；2021 OBE；2025 皇家学会院士+美国国家工程院。(src: en.wiki)"}, {"id": "F10", "conf": "A", "t": "学生/博后含 Eric Xing、Daphne Koller、Nando de Freitas 等。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "用一本教材定义全球 AI 教育的\"通用语\"(AIMA, 135 国)", "from": "F2", "cl": "CL12"}, {"id": "C2", "t": "横跨 AI 众多子领域的罕见广度", "from": "F3", "cl": "CL4"}, {"id": "C3", "t": "把\"控制问题\"上升为一个新研究范式(可证明有益 AI/逆强化学习)", "from": "F3,F5", "cl": "CL3"}, {"id": "C4", "t": "把学术声誉转化为面向公众与联合国/BBC 的公共影响力", "from": "F6,F7", "cl": "CL14"}, {"id": "C5", "t": "不仅写论文，还创办机构(CHAI/IASEAI)把安全建制化", "from": "F4,F8", "cl": "CL14"}, {"id": "C6", "t": "培养出多位独立成名的学生", "from": "F10", "cl": "CL7"}, {"id": "C7", "t": "以鲜明比喻(\"冲向悬崖\")塑造风险叙事", "from": "F7", "cl": "CL15"}]}, {"id": "F26", "name": "F26 Nick Bostrom", "intro": "牛津哲学家、《Superintelligence》作者、前 FHI 主任。1973 生。", "facts": [{"id": "F1", "conf": "A", "t": "1973.3.10 生于瑞典赫尔辛堡(原名 Niklas Boström)；横跨哲学、物理、计算神经科学、伦敦政经 2000 哲学博士(观测选择效应)——极端跨学科。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "2000–2002 耶鲁任教；2002–2005 牛津英国学院博士后。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "2002《Anthropic Bias》观测选择效应。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "2003 在《Philosophical Quarterly》发表\"模拟论证\"(我们是否活在计算机模拟中)——成为流行文化议题。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "2008 与 Ćirković 合编《Global Catastrophic Risks》；提出存在性风险(existential risk)框架。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "2014《Superintelligence》成纽时畅销书，获霍金、盖茨、马斯克背书——把超级智能风险推入主流。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2024《Deep Utopia》转而讨论\"问题被解决后\"的人生意义。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "2005 在牛津创办人类未来研究所(FHI)，长期为 AI 风险/长期主义思想策源地；2024.4.17 FHI 关闭，他转任 Macrostrategy Research Initiative 首席研究员。(src: en.wiki)"}, {"id": "F9", "conf": "B", "t": "2023.1 一封 1996 年含种族主义言论的旧邮件被曝，他公开致歉称内容\"令人作呕\"；牛津 2023.8 调查结论认为他\"不持种族主义观点\"、致歉\"真诚\"。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "用极端跨学科训练(哲学+物理+神经科学)重构问题框架", "from": "F1", "cl": "CL4"}, {"id": "C2", "t": "创造并普及一整套思想词汇(存在性风险/模拟论证/超级智能)", "from": "F4,F5,F6", "cl": "CL15"}, {"id": "C3", "t": "用一本书把一个边缘议题推成全球主流讨论", "from": "F6", "cl": "CL15"}, {"id": "C4", "t": "创办一个长期影响整个领域议程的研究所(FHI)", "from": "F8", "cl": "CL6"}, {"id": "C5", "t": "在自己定义的领域内持续自我更新(从风险转向乌托邦)", "from": "F7", "cl": "CL15"}, {"id": "C6", "t": "（边界）思想影响力巨大者也会因历史言论陷入严重声誉争议", "from": "F9", "cl": "CL16"}, {"id": "C7", "t": "善于将抽象哲学包装成可传播、可被科技领袖采纳的叙事", "from": "F6", "cl": "CL15"}]}, {"id": "F27", "name": "F27 Paul Christiano", "intro": "AI 对齐研究者、ARC 创始人、现 NIST 美国 AI 安全研究所安全负责人。", "facts": [{"id": "F1", "conf": "A", "t": "2008 国际数学奥赛(IMO)银牌；2012 MIT 数学本科(做数据结构/量子密码/组合优化)；2017 伯克利理论 CS 博士(师从 Umesh Vazirani)。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "2017 合著《Deep RL from Human Preferences》，被视为 RLHF 主要架构者之一——后成 ChatGPT 等的核心技术；纽时称其为 AI 安全的\"重要一步\"。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "2018 合著《AI safety via debate》解决可扩展监督问题；提出 iterated amplification、ELK(引出潜在知识)等概念。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "在 OpenAI 领导对齐团队；2021 离开转做理论对齐。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "2021 创办非营利对齐研究中心(ARC)，做理论对齐与模型评测(危险能力评估)。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "2023 公开估计\"AI 接管有 10–20% 概率、多数人死亡\"，并说\"达到人类水平 AI 后不久有 50/50 的厄运概率\"。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2023 入 TIME100 AI、英国前沿 AI 工作组顾问；2024.4 任 NIST 美国 AI 安全研究所安全负责人(此前 NIST 员工因其 EA 背景威胁辞职)。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "Anthropic 长期利益信托初始受托人之一。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "数学奥赛级的硬核理论底子转向 AI 对齐", "from": "F1", "cl": "CL8"}, {"id": "C2", "t": "既做出落地技术(RLHF)又开辟理论概念(debate/ELK)", "from": "F2,F3", "cl": "CL3"}, {"id": "C3", "t": "从大公司内部对齐负责人转为独立非营利创办者", "from": "F4,F5", "cl": "CL6"}, {"id": "C4", "t": "公开量化自己对厄运的概率估计、不回避极端判断", "from": "F6", "cl": "CL14"}, {"id": "C5", "t": "把研究身份带入政府监管核心(NIST 安全负责人)", "from": "F7", "cl": "CL14"}, {"id": "C6", "t": "把\"评测危险能力\"做成可操作的行业方法", "from": "F5", "cl": "CL14"}, {"id": "C7", "t": "（边界）其 EA 背景在体制内引发信任摩擦", "from": "F7", "cl": "CL16"}]}, {"id": "F28", "name": "F28 Richard Sutton", "intro": "阿尔伯塔大学教授、强化学习奠基人、2024 图灵奖得主。1957/58 生。", "facts": [{"id": "F1", "conf": "A", "t": "1957/58 生于俄亥俄托莱多；1978 斯坦福心理学学士；1984 UMass Amherst CS 博士(师从 Andrew Barto，论文提出 actor-critic 与时间信用分配)——从心理学进入 AI。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "1985–1994 GTE 实验室；1998–2002 AT&T 香农实验室；2003 起阿尔伯塔大学教授；2017–2023 DeepMind Alberta 杰出研究科学家；2024 起 Keen Technologies(与 John Carmack 合作 AGI)。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "1988《Learning to predict by the methods of temporal differences》奠定时序差分(TD)学习。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "1998 与 Barto 合著《Reinforcement Learning: An Introduction》(2018 第二版)——RL 领域圣经。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "1999 与 Precup、Singh 提出 options 时间抽象框架；2000 提出带函数逼近的策略梯度方法。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "2019《The Bitter Lesson》(苦涩的教训)：\"利用算力的通用方法最终最有效，且优势巨大\"——深刻影响大模型时代的方法论。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2025 与 David Silver 合著《Welcome to the Era of Experience》。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "2001 AAAI Fellow、2021 皇家学会院士；2024 与 Barto 共获图灵奖(RL 概念与算法基础)。(src: en.wiki)"}, {"id": "F9", "conf": "A", "t": "2015 入加拿大籍、2017 放弃美国籍——以行动表达立场。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "从心理学跨入 AI，把\"学习/奖励\"心理直觉变成数学框架", "from": "F1,F3", "cl": "CL4"}, {"id": "C2", "t": "数十年专注同一核心问题(强化学习)并奠定其理论基础", "from": "F3,F4,F5", "cl": "CL1"}, {"id": "C3", "t": "用一本教材定义并培育整个子领域", "from": "F4", "cl": "CL12"}, {"id": "C4", "t": "提出影响整个时代方法论的元洞察(The Bitter Lesson)", "from": "F6", "cl": "CL15"}, {"id": "C5", "t": "持续坚持\"算力+通用方法\"信念、不迷信领域知识(数十年后被大模型验证)", "from": "F6", "cl": "CL2"}, {"id": "C6", "t": "学术界与产业前沿(DeepMind/Carmack)长期穿梭", "from": "F2", "cl": "CL9"}, {"id": "C7", "t": "以个人重大行动(改国籍)表达价值立场", "from": "F9", "cl": "CL16"}]}, {"id": "F29", "name": "F29 Ian Goodfellow", "intro": "GAN 提出者、《Deep Learning》教材作者之一。", "facts": [{"id": "F1", "conf": "A", "t": "斯坦福 CS 本硕(随 Andrew Ng)；2015.2 蒙特利尔大学机器学习博士(师从 Bengio、Courville)——贯通两大师门。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "2014 发明生成对抗网络(GANs)，用两个网络对抗式互相提升——开创整条生成式研究脉络(据传灵感来自酒吧讨论的当晚)。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "开发 Google 街景地址转写系统；系统性揭示机器学习的对抗样本安全漏洞。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "2016 与 Bengio、Courville 合著《Deep Learning》(花书)并为第一作者——领域标准教材；2020 为 AIMA 写深度学习章节。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "Google Brain→2016.3 OpenAI→2017.3 回 Google→2019 加入 Apple 任机器学习总监(特殊项目组)。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "2022.4 因反对 Apple 的\"重返办公室\"政策辞职；2022.5 加入 Google DeepMind；2025 离开 Google；2026.7 联合创办创业公司。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2017 MIT TR35；2019 外交政策 100 全球思想者。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "一个原创架构(GAN)开辟一整条研究脉络", "from": "F2", "cl": "CL3"}, {"id": "C2", "t": "同时贯通两大师门(Ng+Bengio)的训练", "from": "F1", "cl": "CL8"}, {"id": "C3", "t": "用一本教材(花书)定义深度学习的入门标准", "from": "F4", "cl": "CL12"}, {"id": "C4", "t": "既做生成又做对抗安全、看到技术的两面", "from": "F2,F3", "cl": "CL14"}, {"id": "C5", "t": "把模型能力落到真实产品(街景地址转写)", "from": "F3", "cl": "CL5"}, {"id": "C6", "t": "为价值/工作方式(远程办公)不惜从顶级公司离职", "from": "F6", "cl": "CL16"}, {"id": "C7", "t": "在顶级机构间高频流动、始终被争抢", "from": "F5,F6", "cl": "CL9"}]}, {"id": "F30", "name": "F30 Aidan Gomez", "intro": "Cohere 联合创始人兼 CEO、Transformer 论文作者之一。", "facts": [{"id": "F1", "conf": "A", "t": "生于加拿大多伦多、长于安大略 Brighton；多伦多大学 CS+数学本科；牛津 CS 博士(为创办 Cohere 一度暂停，2024 才拿到学位)。(src: en.wiki)"}, {"id": "F2", "conf": "A", "t": "2017 年仅 20 岁、作为 Google Brain 实习生，与另外七人合著《Attention Is All You Need》(Transformer)——被认为改变了 AI 行业、催生 ChatGPT。(src: en.wiki)"}, {"id": "F3", "conf": "A", "t": "2017 创办 FOR.ai 协作学习项目；后衍生 Cohere For AI(现 Cohere Labs)，发布开源多语言模型 Aya。(src: en.wiki)"}, {"id": "F4", "conf": "A", "t": "2018 合著《One Model to Learn Them All》(多任务学习)。(src: en.wiki)"}, {"id": "F5", "conf": "A", "t": "2019 离开 Google Brain，与 Ivan Zhang、Nick Frosst 创办 Cohere，定位企业级 LLM(聊天/搜索/产品)，任 CEO。(src: en.wiki)"}, {"id": "F6", "conf": "A", "t": "截至 2025.9 累计融资约 16 亿美元，估值超 70 亿。(src: en.wiki)"}, {"id": "F7", "conf": "A", "t": "2023 TIME100 AI；2025.4 入 Rivian 董事会。(src: en.wiki)"}, {"id": "F8", "conf": "A", "t": "公开认为\"存在性风险\"被夸大，真正风险是社媒上自动化的虚假信息扩散；认为美国会在 AI 竞争中胜过中国。(src: en.wiki)"}], "caps": [{"id": "C1", "t": "极年轻(20 岁实习生)即参与定义时代的核心架构(Transformer)", "from": "F2", "cl": "CL3"}, {"id": "C2", "t": "把博士学业让位于创业窗口、果断切换", "from": "F1,F5", "cl": "CL9"}, {"id": "C3", "t": "选\"企业级\"作为差异化定位、避开消费端红海", "from": "F5", "cl": "CL11"}, {"id": "C4", "t": "早早组织开放协作社区(FOR.ai/Aya 多语言开源)", "from": "F3", "cl": "CL13"}, {"id": "C5", "t": "在风险叙事上公开反主流、聚焦\"现实风险\"而非末日", "from": "F8", "cl": "CL14"}, {"id": "C6", "t": "把一篇论文的声誉转化为独角兽公司与资本", "from": "F2,F6", "cl": "CL10"}]}, {"id": "F31", "name": "F31 刘铁岩", "intro": "前微软亚洲研究院副院长、中关村学院院长。", "facts": [{"id": "F1", "conf": "A", "t": "曾任微软亚洲研究院副院长、机器学习组首席研究员；IEEE Fellow、ACM 杰出科学家；CMU/清华/中科大/南开兼职教授；现任北京中关村学院院长。(src: 多源)"}, {"id": "F2", "conf": "A", "t": "\"排序学习(Learning to Rank)\"领域开创者之一，推动机器学习与信息检索融合；2011 专著《Learning to Rank for IR》销近 10 万册，为 Springer 华人计算机作者十大畅销书之一。(src: 多源)"}, {"id": "F3", "conf": "A", "t": "2017 团队开源 LightGBM，成为 Kaggle/KDD Cup/工业界最流行的机器学习工具之一。(src: 多源)"}, {"id": "F4", "conf": "A", "t": "2018 提出对偶学习(dual learning)框架，助微软中英新闻翻译达人类专家水平，次年 WMT 国际机器翻译赛夺 8 项冠军。(src: 多源)"}, {"id": "F5", "conf": "A", "t": "2019 研发最强麻将 AI \"Suphx\"，在天凤平台达十段，显著超越顶级人类。(src: 多源)"}, {"id": "F6", "conf": "A", "t": "2018 合著《分布式机器学习：理论、算法与实践》。(src: 多源)"}, {"id": "F7", "conf": "A", "t": "发表论文 200+、引用数万；任 WWW/SIGIR/KDD/NIPS/AAAI 等程序委员会主席/资深领域主席；2021 ACM Fellow。(src: 多源)"}], "caps": [{"id": "C1", "t": "开创并系统化一个研究子领域(排序学习)并写成定义性专著", "from": "F2", "cl": "CL3"}, {"id": "C2", "t": "把研究沉淀成全行业默认使用的开源工具(LightGBM)", "from": "F3", "cl": "CL13"}, {"id": "C3", "t": "反复用\"竞赛/对标人类\"的硬指标证明方法(WMT 8 冠、麻将十段)", "from": "F4,F5", "cl": "CL3"}, {"id": "C4", "t" <div class="card">

 <div class="layer l1"><b class="tag">① 门槛项 · 事实层面近乎全员</b>

 h+=`<table><thead><tr><th>人物</th><th>原子能力（落入本簇）</th><th>事实</th></tr></thead><tbody>`;
 DATA.people.forEach(p=>p.caps.forEach(c=>{if(c.cl===k)h+=`<tr><td class="p">${p.id} ${pname(p.id)}</td><td>${c.t}</td><td class="from">${c.from}</td></tr>`}));
 h+=`</tbody></table>`;
 document.getElementById('cluDetail').innerHTML=h;
 document.getElementById('cluDetail').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- 全部原子能力 ---------- */
(function(){
 const opts=Object.keys(C).map(k=>`<option value="${k}">${k} ${C[k]}</option>`).join('');
 const popts=DATA.people.map(p=>`<option value="${p.id}">${p.id} ${pname(p.id)}</option>`).join('');
 document.getElementById('t-caps').innerHTML=`<div class="card"><h2>全部 ${DATA.totals.caps} 条原子能力 → 能力簇 对应关系</h2>
 <p class="mut sm">每条能力都挂在具体硬事实上（from 列），并被归入一个能力簇。可按簇/人/关键词筛选。</p>
 <div class="controls"><input id="q" placeholder="关键词搜索能力文本…"><select id="fcl"><option value="">全部能力簇</option>${opts}</select><select id="fp"><option value="">全部人物</option>${popts}</select></div>
 <div class="mut sm" id="capCount"></div>
 <table><thead><tr><th>人物</th><th>能力</th><th>能力簇</th><th>事实</th></tr></thead><tbody id="capBody"></tbody></table></div>`;
 const rows=[];DATA.people.forEach(p=>p.caps.forEach(c=>rows.push({pid:p.id,nm:pname(p.id),t:c.t,cl:c.cl,from:c.from})));
 const body=document.getElementById('capBody'),q=document.getElementById('q'),fcl=document.getElementById('fcl'),fp=document.getElementById('fp'),cc=document.getElementById('capCount');
 function render(){const kw=q.value.trim(),cl=fcl.value,pp=fp.value;
  const f=rows.filter(r=>(!cl||r.cl===cl)&&(!pp||r.pid===pp)&&(!kw||r.t.includes(kw)));
  cc.textContent=`显示 ${f.length} / ${rows.length} 条`;
  body.innerHTML=f.map(r=>`<tr><td class="p">${r.pid} ${r.nm}</td><td>${r.t}</td><td>${chipS(r.cl)}<span class="mut sm"> ${C[r.cl]}</span></td><td class="from">${r.from}</td></tr>`).join('');}
 q.oninput=render;fcl.onchange=render;fp.onchange=render;render();
})();

/* ---------- 三人走查 ---------- */
(function(){
 let h=`<div class="card"><h2>三人端到端走查：事实 → 原子能力 → 能力簇 → 画像层</h2>
 <p class="mut sm">完整呈现“怎么从一个人的硬事实，一步步走到他在画像里的位置”。</p></div>`;
 ["F01","F31","F32"].forEach(pid=>{const p=DATA.people.find(x=>x.id===pid);
  const fps=[...new Set(p.caps.map(c=>c.cl))];
  h+=`<div class="card"><h2>${p.id} ${p.name}</h2><div class="mut sm" style="margin-bottom:8px">${p.intro}</div>`;
  h+=`<div class="layer l3" style="background:rgba(124,131,255,.08);border-color:rgba(124,131,255,.4)"><b>走查解读：</b> ${DATA.walk[pid]}</div>`;
  h+=`<h3>① 硬事实（${p.facts.length} 条，节选）</h3>`;
  h+=p.facts.slice(0,8).map(f=>`<div class="fact"><span class="conf">${f.conf}</span> <b>${f.id}</b> ${f.t}</div>`).join('');
  if(p.facts.length>8)h+=`<div class="fact mut">…共 ${p.facts.length} 条，详见 research/facts/${p.id}…md</div>`;
  h+=`<h3>② 原子能力 → ③ 能力簇</h3>`;
  h+=p.caps.map(c=>`<div class="caprow">${chipS(c.cl)} <b>${c.id}</b> ${c.t} <span class="from">· ${c.from}</span></div>`).join('');
  h+=`<h3>④ 能力簇指纹 → 画像定位</h3><div class="fp">${fps.map(chip).join('')}</div>`;
  const arc=DATA.archetypes.filter(a=>a[3].includes(pid)).map(a=>a[0]);
  h+=`<div class="note">归入原型：<b>${arc.join(' / ')||'—'}</b>。在画像三层中：命中“门槛项”（硬成果+长期投入）；其“区分项”集中在上述指纹簇；其“特异项”见结论页。</div></div>`;
 });
 document.getElementById('t-walk').innerHTML=h;
})();

/* ---------- 60 人映射 ---------- */
(function(){
 let h=`<div class="card"><h2>6 个原型 · 代表人物</h2><p class="mut sm">一个人常同属 2–3 个原型，且很多人在生涯中迁移原型；下表为代表性归类（非排他）。</p>`;
 DATA.archetypes.forEach(a=>{h+=`<div style="margin:10px 0"><b>${a[0]}</b> <span class="chip" style="background:#2a2f3a;color:#cdd2db">${a[1]}</span><div class="mut sm">${a[2]}</div><div style="margin-top:4px">${a[3].map(pid=>`<span class="chip" style="background:#2a2f3a;color:#cdd2db">${pid} ${pname(pid)}</span>`).join('')}</div></div>`});
 h+=`</div><div class="card"><h2>60 人 · 能力簇指纹（点击展开事实与能力）</h2><div id="pplist"></div></div>`;
 document.getElementById('t-ppl').innerHTML=h;
 const list=document.getElementById('pplist');
 DATA.people.forEach(p=>{const fps=[...new Set(p.caps.map(c=>c.cl))];
  const d=document.createElement('div');d.className='person';
  d.innerHTML=`<div class="ph"><div><b>${p.id}</b> ${p.name}<div class="fp">${fps.map(chipS).join('')}</div></div><span class="mut sm">${p.facts.length}事实·${p.caps.length}能力 ▾</span></div>
   <div class="pb"><div class="mut sm" style="margin-bottom:6px">${p.intro}</div>
   ${p.caps.map(c=>`<div class="caprow">${chipS(c.cl)} <b>${c.id}</b> ${c.t} <span class="from">· ${c.from}</span></div>`).join('')}
   <h3>硬事实</h3>${p.facts.map(f=>`<div class="fact"><span class="conf">${f.conf}</span> <b>${f.id}</b> ${f.t}</div>`).join('')}</div>`;
  d.querySelector('.ph').onclick=()=>d.classList.toggle('open');
  list.appendChild(d)});
})();
</script>
</body>
</html>
